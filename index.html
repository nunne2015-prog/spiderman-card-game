input{font:inherit;padding:10px 12px;border:2px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--fg);width:100%;margin:4px 0 10px}

function oppBoxes3(v){const role=i=>i===v.att?'⚔️ атакует':i===v.def?'🛡 защищается':'👀 может подкинуть';return v.opps.map((o,k)=>`<div class="box opponent-zone"><div class="row" style="justify-content:space-between"><span class="playerline">${avatarHTML(o.avatar)}<span><b>${esc(o.name)}</b> ${o.connected===false?'⚪':'🟢'} <span class="mu">· ${role(o.i)}</span><br><span class="mu">карт: ${o.count}</span></span></span>${k===0?`<span class="mu">Колода: ${v.deckCount} · Бито: ${v.disc}</span>`:''}</div><div class="cards">${Array(o.count).fill('<div class="bk"></div>').join('')}</div></div>`).join('')}
function renderGame(v,isOnline,pidx){const n3=v.n===3,isA=v.att===pidx,isD=n3?v.def===pidx:!isA,isT=n3?v.tp===pidx:isA,op=open(v),hand=v.myHand,nm=i=>esc(v.names?.[i]||'Игрок');let msg='';if(v.status==='done')msg=v.winner===-1?'🤝 Ничья':(v.winner===pidx?'🏆 Ты победил!':'😔 Ты проиграл');else if(isOnline&&v.oppConnected===false)msg=n3?'⚠️ Один из игроков отключился. Ждём переподключения…':'⚠️ Соперник отключился. Ждём переподключения…';else if(n3)msg=msg3(v,pidx,isA,isD,isT,op);else if(isA)msg=v.table.length===0?'Твоя атака: выбери карту и показатель':op?'Соперник отвечает…':(isSaveBonus(v.table[v.table.length-1]?.d)?'Соперник сыграл «Спаси всех» — нажми «Бито»':'Соперник отбился! Подкинь карту с большим значением или нажми «Бито»');else msg=op?`Бей карту: «${SN[op.s]}» должен быть больше ${val(op.a,op.aBoost,op.s)}`:'Соперник выбирает карту…';const canPlay=!isOnline||v.oppConnected!==false;const canA=v.status==='playing'&&canPlay&&isT&&!op&&v.table.length<6&&(!v.table.length||(v.defCount??v.oppCount)>0);const bonusOnTable=v.steal?.active&&v.steal?.bonus?`<div class="pair"><div><span class="badge">БОНУС РАЗЫГРАН</span>${bonusCard(v.steal.bonus)}</div></div>`:'';const table=bonusOnTable+v.table.map(t=>`<div class="pair"><div class="pair-side"><span class="badge">${SN[t.s]} ${val(t.a,t.aBoost,t.s)}${t.aBoost?` (итого с бонусом)`:``}</span>${card(t.a,'',t.s)}${t.aBoost?bonusCard(t.aBoost,'miniBonus'):''}</div><div class="pair-side">${t.d?(isBonus(t.d)?`<span class="badge">БОНУС</span>${bonusCard(t.d)}`:`<span class="badge">${SN[t.s]} ${val(t.d,t.dBoost,t.s)}${t.dBoost?' (итого с бонусом)':''}</span>${card(t.d,'',t.s)}${t.dBoost?bonusCard(t.dBoost,'miniBonus'):''}`):`<span class="badge">Ожидает защиты</span><div class="bk" style="width:clamp(78px,15vw,112px);aspect-ratio:140/200;opacity:.35"></div>`}</div></div>`).join('');const mine=hand.map(id=>{if(isBonus(id)){if(isCover(id)){const canCover=v.status==='playing'&&canPlay&&((isD&&!!op)||((isA||isT)&&!op));const changeSel=selCover===id;return bonusCard(id,(changeSel?'on ':'')+(canCover?'me':'dim'),canCover?`data-a="coverPick" data-id="${id}"`: '')}const stealUsable=BONUS[id]?.type==='steal'&&v.status==='playing'&&canPlay&&isA&&!v.table.length&&!v.steal&&(isOnline||mode==='local');const saveUsable=isSaveBonus(id)&&v.status==='playing'&&canPlay&&isD&&!!op;const stat=op?.s??(v.table.length?v.table[0].s:-1);const solo=hand.length===1&&isOnline&&v.status==='playing'&&canPlay&&!v.steal&&(op?isD:(v.table.length?isT:isA));const dumpUsable=solo&&!stealUsable&&!saveUsable;const boostUsable=!solo&&isBoostBonus(id)&&v.status==='playing'&&canPlay&&((stat>=0&&boostOK(id,stat))||(isA&&!v.table.length&&!!sel));const usable=stealUsable||saveUsable||boostUsable||dumpUsable;return bonusCard(id,(selBoost===id?'on ':'')+(usable?'me':'dim'),usable?`data-a="${dumpUsable?'dump':boostUsable?'boostPick':saveUsable?'def':'bonus'}" data-id="${id}"`:'')}const c=CARDS[id];let cls='',a=`data-id="${id}"`;if(canA&&!v.steal){const prev=v.table.length?v.table[v.table.length-1]:null;const min=prev?.d&&!isBonus(prev.d)?CARDS[prev.d]?.s[prev.s]:null;const stat=v.table[0]?.s??0;const badd=selBoost&&boostOK(selBoost,stat)?BONUS[selBoost].points:0;const threshold=prev?.d?val(prev.d,prev.dBoost,stat):null;const allowed=!isSaveBonus(prev?.d)&&(threshold==null||c.s[stat]+badd>threshold);if(allowed){cls=sel===id?'on me':'me';a+=' data-a="pick"'}else cls='dim'}else if(v.status==='playing'&&canPlay&&isD&&op){if(c.s[op.s]+(selBoost&&boostOK(selBoost,op.s)?BONUS[selBoost].points:0)>val(op.a,op.aBoost,op.s)){cls='ok';a+=' data-a="def"'}else cls='dim'}else if(v.status==='playing'&&isOnline)cls='dim';return card(id,cls,(op&&isD)?op.s:(v.table.length?v.table[0].s:-1),a)}).join('');const boostNotice=selBoost?`<div class="box"><b>Выбран бонус:</b> ${esc(BONUS[selBoost]?.n||'')} (+${BONUS[selBoost]?.points||0}) <button class="g" data-a="boostClear">Отменить</button></div>`:'';const coverPick=selCover?`<div class="box"><b>${esc(BONUS[selCover]?.n||'Обложка')}</b> — выбери новый показатель:<div class="row">${SN.map((x,k)=>`<button class="r" data-a="coverStat" data-s="${k}">${x}</button>`).join('')}</div><button class="g" data-a="coverCancel">Отмена</button></div>`:'';const pick=canA&&sel?`<div class="box"><b>${esc(CARDS[sel].n)}</b> — выбери показатель:<div class="row">${CARDS[sel].s.map((x,k)=>`<button class="r" data-a="atk" data-s="${k}" ${(selBoost&&!boostOK(selBoost,k))||((v.pendingStat??G?.pendingStat)!=null&&(v.pendingStat??G.pendingStat)!==k)?'disabled':''}>${SN[k]} ${x}${selBoost&&boostOK(selBoost,k)?` + ${BONUS[selBoost].points}`:''}</button>`).join('')}</div></div>`:'';let end='';if(isOnline&&v.status==='done'){const voted=v.rematch?.[0],st=v.stats||[];end=`<div class="box"><div class="msg">Итоги партии · Раунды ${n3?v.names.map((x,i)=>esc(x)+' '+(v.roundWins?.[i]||0)).join(' · '):(v.roundWins?.[pidx]||0)+':'+(v.roundWins?.[1-pidx]||0)}</div><div class="row"><span>Твои атаки: <b>${st[pidx]?.attacks||0}</b></span><span>Защиты: <b>${st[pidx]?.defends||0}</b></span><span>Забрал: <b>${st[pidx]?.takes||0}</b></span></div><div class="row" style="margin-top:10px"><button class="r" data-a="rematch" ${voted?'disabled':''}>${voted?'Реванш предложен ✓':'Реванш'}</button><button class="g" data-a="leave">Вернуться в меню</button></div>${n3?`<p class="mu">Согласны на реванш: ${v.rematchVotes||0}/3</p>`:(v.rematch?.[1]?'<p class="mu">Соперник согласен на реванш ✓</p>':'')}</div>`}
const actor=n3?(op?v.def:v.tp):-1,mineTurn=n3?actor===pidx:isA;const turn=isOnline&&v.status==='playing'?`<div class="turnbar ${mineTurn?'mine':'opp'}">${mineTurn?'ВАШ ХОД':(n3?'ХОД: '+nm(actor):'ХОД СОПЕРНИКА')} · <span id="turnTimer" class="timer">60 сек</span></div>`:'';app.innerHTML=`${turn}${n3?scorebar3(v,pidx):`<div class="scorebar"><span class="score-side score-name">🏆 ${esc(v.myName||'Ты')}</span><b>${v.roundWins?.[pidx]||0} : ${v.roundWins?.[1-pidx]||0}</b><span class="score-side score-name">${esc(v.oppName||'Соперник')} 🏆</span></div>`}${n3?oppBoxes3(v):`<div class="box opponent-zone"><div class="row" style="justify-content:space-between"><span class="playerline">${isOnline?avatarHTML(v.oppAvatar):''}<span><b>${esc(v.oppName)}</b> ${isOnline?(v.oppConnected===false?'⚪':'🟢'):''}<br><span class="mu">карт: ${v.oppCount}</span></span></span><span class="mu">Колода: ${v.deckCount} · Бито: ${v.disc}</span></div><div class="cards">${Array(v.oppCount).fill('<div class="bk"></div>').join('')}</div></div>`}<div class="box battlefield"><div class="battle-heading"><span class="battle-kicker">АРЕНА</span><div class="msg">${msg}</div></div><div class="cards battlefield-cards">${table||'<div class="empty-table"><span class="empty-emblem">🕷</span><b>Поле готово к бою</b><span>Выбери карту, чтобы начать</span></div>'}</div><div class="row">${v.status==='playing'&&canPlay&&isD&&op?'<button class="r" data-a="take">Забрать все карты</button>':''}${v.status==='playing'&&canPlay&&isT&&v.table.length&&!op?`<button data-a="pass">${n3&&!isA?'Бито ✓':(n3?'Больше нечего подкинуть ✓':'Бито ✓')}</button>`:''}${v.status==='playing'?`<button class="g" data-a="${isOnline?'leave':'menu'}">Выйти</button>`:''}</div></div>${boostNotice}${coverPick}${pick}<div class="box hand-zone"><div class="playerline">${isOnline?avatarHTML(v.myAvatar):''}<b>${esc(v.myName||'Твои карты')}</b>${n3?` <span class="mu">· ${isA?'⚔️ ты атакуешь':isD?'🛡 тебя атакуют':'👀 можешь подкинуть'}</span>`:''}</div><div class="cards">${mine||'<span class="mu">Карт нет</span>'}</div></div>${isOnline?stealPanel(v):''}${end}`;if(isOnline&&v.status==='playing')startTurnTimer();else stopTimer()}
function renderLocal(){const v={att:G.att,pendingStat:G.pendingStat,table:G.table,disc:G.disc,status:G.status,winner:G.winner,myHand:G.hands[0],oppCount:G.hands[1].length,deckCount:G.deck.length,myName:'Твои карты',oppName:'Бот'};renderGame(v,false,0);sched()}
function renderOnline(){if(!onlineView)return;sel=null;renderGame(onlineView,true,me)}
function localAct(fn){const g=structuredClone(G);const err=fn(g);if(err)return toast(err);G=g;sel=null;renderLocal()}
app.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id;if(a==='menu')menu();else if(a==='avatar')chooseAvatar();else if(a==='removeAvatar')removeAvatar();else if(a==='leave')leaveOnline();else if(a==='local')startLocal();else if(a==='onlineMenu')onlineMenu();else if(a==='create'||a==='create2')connect('create',2);else if(a==='create3')connect('create',3);else if(a==='join')connect('join');else if(a==='reconnect')tryReconnect();else if(a==='ready')sendReady();else if(a==='saveName'){const n=($('lobbyName')?.value||'').trim().slice(0,20);if(!n)return toast('Введи имя');localStorage.setItem('spiderName',n);ws?.send(JSON.stringify({type:'name',name:n}))}else if(a==='copy'){navigator.clipboard?.writeText(room);toast('Код скопирован')}else if(a==='invite'){navigator.clipboard?.writeText(inviteLink());toast('Ссылка-приглашение скопирована')}else if(a==='boostPick'){selBoost=selBoost===id?null:id;mode==='local'?renderLocal():renderGame(onlineView,true,me)}else if(a==='coverPick'){selCover=id;mode==='local'?renderLocal():renderGame(onlineView,true,me)}else if(a==='coverCancel'){selCover=null;mode==='local'?renderLocal():renderGame(onlineView,true,me)}else if(a==='coverStat'&&selCover){const c=selCover;mode==='local'?localAct(g=>doChangeStat(g,0,c,+t.dataset.s)):sendAction('changeStat',{card:c,stat:+t.dataset.s});selCover=null}else if(a==='coverPick'){selCover=id;mode==='local'?renderLocal():renderGame(onlineView,true,me)}else if(a==='coverCancel'){selCover=null;mode==='local'?renderLocal():renderGame(onlineView,true,me)}else if(a==='coverStat'&&selCover){const c=selCover;mode==='local'?localAct(g=>doChangeStat(g,0,c,+t.dataset.s)):sendAction('changeStat',{card:c,stat:+t.dataset.s});selCover=null}else if(a==='boostClear'){selBoost=null;mode==='local'?renderLocal():renderGame(onlineView,true,me)}else if(a==='dump'){if(confirm(`Выложить последнюю карту «${BONUS[id]?.n}» и избавиться от всех карт?`))sendAction('dump',{card:id})}else if(a==='bonus'){if(confirm(BONUS[id]?.witch?`Использовать «${BONUS[id].n}»?\nЕсли у соперника не больше 6 карт — заберёшь всю его руку, а он возьмёт новые из колоды.\nЕсли больше 6 — посмотришь 2 его карты.`:`Использовать бонус «${BONUS[id]?.n}» и украсть ${BONUS[id]?.count} карт?`)){if(mode==='local')localAct(g=>doLocalBonus(g,0,id));else sendAction('bonus',{card:id})}}else if(a==='stealPick')sendAction('stealSelect',{index:+t.dataset.index});else if(a==='stealPeekOk')sendAction('stealFinish',{decision:'peek'});else if(a==='stealKeep')sendAction('stealFinish',{decision:'keep'});else if(a==='stealDiscard')sendAction('stealFinish',{decision:'discard'});else if(a==='pick'){const v=mode==='local'?{table:G.table}:onlineView;if(v.table.length){mode==='local'?localAct(g=>doAttack(g,0,id,g.table[0].s,selBoost)):sendAction('attack',{card:id,stat:v.table[0].s,boost:selBoost}) ; selBoost=null}else{sel=sel===id?null:id;mode==='local'?renderLocal():renderGame(onlineView,true,me)}}else if(a==='atk'&&sel){const c=sel;mode==='local'?localAct(g=>doAttack(g,0,c,+t.dataset.s,selBoost)):sendAction('attack',{card:c,stat:+t.dataset.s,boost:selBoost}); selBoost=null}else if(a==='def'){mode==='local'?localAct(g=>doDefend(g,0,id,selBoost)):sendAction('defend',{card:id,boost:selBoost}); selBoost=null}else if(a==='take'){mode==='local'?localAct(g=>doTake(g,0)):sendAction('take')}else if(a==='pass'){mode==='local'?localAct(g=>doPass(g,0)):sendAction('pass')}else if(a==='rematch')sendAction('rematch')});
if(inviteRoom())onlineMenu();else menu();
</script></body></html>
